# envdoctor 核心：以 cdylib 形式对外暴露 C ABI，由 Python 侧通过 ctypes 调用
[package]
name = "envdoctor_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "envdoctor_core"
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
# 保留符号与调试信息：便于在 gdb/lldb 中调试由 Python 进程加载的 Rust 代码；
# C ABI 导出符号（#[no_mangle]）无论如何都不会被剥离
strip = "none"
