[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envdoctor"
version = "0.2.0"
description = "Full-stack development environment diagnostics: Rust core (C ABI) + Typer CLI + PySide6 GUI."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Diderde" }]
dependencies = ["typer>=0.12"]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
tui = ["textual>=1.0"]

[project.scripts]
envdoctor = "envdoctor.cli:moona_hoshinova"

[tool.setuptools.packages.find]
where = ["src"]

# binding.py 支持把 Rust 核心 DLL 放进包内 `_native/` 随 wheel 分发；
# 没有这段的话构建出的 wheel 永远不含该目录，"随包分发"形态实际不可用。
[tool.setuptools.package-data]
envdoctor = ["_native/*.dll", "_native/*.so", "_native/*.dylib"]
