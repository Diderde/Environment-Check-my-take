[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envdoctor"
version = "0.2.0"
description = "Full-stack development environment diagnostics: Rust core (C ABI) + Typer CLI + PySide6 GUI."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Diderde" }]
dependencies = ["typer>=0.12"]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
tui = ["textual>=1.0"]

[project.scripts]
envdoctor = "envdoctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
